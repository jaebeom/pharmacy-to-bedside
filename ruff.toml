# Python 정적 검사 설정. 4명이 같은 워크스페이스에 병렬로 코드를 쓰므로
# 스타일 드리프트와 잔버그를 사람 리뷰 전에 CI 가 잡는다.
#
# 포맷 강제(`ruff format`)는 넣지 않는다. 지금 넣으면 진행 중인 브랜치가 전부 충돌한다.
# 필요하면 G1 이 닫히고 열린 브랜치가 없을 때 별도 PR 로 판단한다.

line-length = 120

# 저장소 검사 도구는 README 가 Python 3.10 이상을 지원한다고 적어 두었고,
# Isaac Sim 5.1 내부 Python 은 3.11, Jazzy 외부 노드는 3.12 다.
# 셋 중 가장 낮은 3.10 에 맞춘다. 올리려면 README 의 최소 버전을 먼저 바꾼다.
target-version = "py310"

[lint]
# E,W 스타일 · F 미사용/오타 · B 흔한 버그 · UP 낡은 문법
# SIM 불필요한 분기 · C4 컴프리헨션 · RET 반환 경로
select = ["E", "F", "W", "B", "UP", "SIM", "C4", "RET"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" role="img" aria-label="P3 시스템 그림: v1.1.0 병원 전 구간의 PC, 역할, 노드, 토픽">
  <style>
    .bg { fill: #ffffff; }
    .panel-a { fill: #eef5f4; stroke: #2a7f86; }
    .panel-b { fill: #f5f7f8; stroke: #6b7478; }
    .box { fill: #ffffff; stroke: #2a7f86; }
    .box-main { fill: #ffffff; stroke: #0f4c5c; stroke-width: 2; }
    .stage { fill: #0f4c5c; }
    .claim { fill: #fff3de; stroke: #e2c48a; }
    .title { fill: #0f4c5c; }
    .text { fill: #16252b; }
    .muted { fill: #53646a; }
    .accent-a { fill: #2a7f86; }
    .accent-b { fill: #5b6468; }
    .on-stage { fill: #ffffff; }
    .on-stage-muted { fill: #cfe7e5; }
    .warn { fill: #9a5a00; }
    .split { stroke: #b86e00; }
    .wire { stroke: #5b6b70; }
    .head { fill: #5b6b70; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #10181b; }
      .panel-a { fill: #14272a; stroke: #4fa3aa; }
      .panel-b { fill: #182024; stroke: #7d888c; }
      .box { fill: #1b2a2f; stroke: #4fa3aa; }
      .box-main { fill: #1b2a2f; stroke: #7cc4ca; }
      .stage { fill: #0d3a45; }
      .claim { fill: #2e2412; stroke: #8a6a2e; }
      .title { fill: #9fd6db; }
      .text { fill: #e4ecee; }
      .muted { fill: #a9b8bc; }
      .accent-a { fill: #7cc4ca; }
      .accent-b { fill: #b3bec2; }
      .on-stage { fill: #ffffff; }
      .on-stage-muted { fill: #bfe0dd; }
      .warn { fill: #f0b45a; }
      .split { stroke: #e0a040; }
      .wire { stroke: #9fb0b5; }
      .head { fill: #9fb0b5; }
    }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="head" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <rect class="bg" width="1000" height="600"/>
  <text class="title" x="16" y="28" font-size="18" font-weight="700">P3 시스템 그림 — v1.1.0 병원 전 구간 (main f316197)</text>
  <text class="muted" x="16" y="48" font-size="12">기본: 한 PC 가 다섯 역할을 띄운다(P3_WORLD=hospital tools/demo_v2.sh up). 두 대: P3_ROLES 로 점선에서 나눈다.</text>

  <!-- PC split -->
  <rect class="panel-a" x="12" y="60" width="296" height="416" rx="12"/>
  <text class="accent-a" x="24" y="78" font-size="12" font-weight="700">두 대일 때 master01 — P3_ROLES=stage</text>
  <rect class="panel-b" x="322" y="60" width="666" height="416" rx="12"/>
  <text class="accent-b" x="334" y="78" font-size="12" font-weight="700">두 대일 때 master02 — P3_ROLES="arm nav stack web"</text>
  <line class="split" x1="315" y1="64" x2="315" y2="472" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- stage -->
  <rect class="stage" x="24" y="86" width="272" height="382" rx="10"/>
  <text class="on-stage" x="38" y="110" font-size="14" font-weight="700">stage — Isaac Sim 5.1 (Python 3.11)</text>
  <text class="on-stage-muted" x="38" y="128" font-size="11">pharmacy_stage.py --preset hospital</text>
  <g class="on-stage" font-size="12">
    <text x="38" y="152">병원 씬 · 물리 · /clock</text>
    <text x="38" y="171">M0609 레일 워크셀 18칸 · 쓴 약통 빠짐</text>
    <text x="38" y="190">조제기 · 씬 컨베이어(2배) → A1 탁자</text>
    <text x="38" y="209">AMR 합본(Ridgeback + UR5 흡착)</text>
    <text x="38" y="228">2D 라이다 · D455 손 카메라(AMR · M0609)</text>
    <text x="38" y="247">봉투 · 약통 · 병상 QR 텍스처</text>
    <text x="38" y="266">가짜 AMR 2 · 보행자 2 · 도크 벽 반투명</text>
    <text x="38" y="285">평가기(보관함) · 단계형 리셋(epoch)</text>
  </g>
  <g class="on-stage-muted" font-size="11">
    <text x="38" y="314">ROS: /clock · /amr_1/scan · TF · 카메라 이미지</text>
    <text x="38" y="332">JSON(String): /isaac/pharmacy/* · /isaac/amr_1/*</text>
    <text x="38" y="350">/isaac/evaluator/cabinet · /isaac/sim/reset_*</text>
    <text x="38" y="368">/m0609/shelf/inventory · /p3/sim_running</text>
    <text x="38" y="398">Isaac 3.11 은 Jazzy(3.12) 인터페이스를</text>
    <text x="38" y="416">import 못 한다 → JSON + 어댑터(ADR 0002)</text>
    <text x="38" y="446">모든 역할이 /clock 을 듣는다(use_sim_time)</text>
  </g>

  <!-- stack -->
  <rect class="box-main" x="334" y="86" width="318" height="250" rx="10"/>
  <text class="title" x="348" y="108" font-size="14" font-weight="700">stack — stub_loop.launch.py</text>
  <g font-size="12">
    <text class="text" x="348" y="132" font-weight="700">isaac_adapter</text><text class="muted" x="462" y="132" font-size="11">JSON ↔ 계약 타입</text>
    <text class="muted" x="348" y="148" font-size="11">srv /pharmacy/dispense · /sim/reset</text>
    <text class="text" x="348" y="172" font-weight="700">orchestrator</text><text class="muted" x="462" y="172" font-size="11">트립 FSM · 재고 · 약 DB</text>
    <text class="muted" x="348" y="188" font-size="11">act /deliver · srv /orchestrator/reset</text>
    <text class="muted" x="348" y="204" font-size="11">srv /orchestrator/check_container</text>
    <text class="text" x="348" y="228" font-weight="700">arm (UR5)</text><text class="muted" x="462" y="228" font-size="11">act pick_pouch · scan_tag</text>
    <text class="muted" x="348" y="244" font-size="11">봉투 QR 이 주문과 맞을 때만 집는다</text>
    <text class="text" x="348" y="266" font-weight="700">pouch_detector</text><text class="muted" x="462" y="266" font-size="11">AMR 손 카메라 QR</text>
    <text class="muted" x="348" y="282" font-size="11">tag_reads · pouches · qr_view</text>
    <text class="text" x="348" y="304" font-weight="700">m0609_detector</text><text class="muted" x="462" y="304" font-size="11">약통 QR 판독</text>
    <text class="text" x="348" y="324" font-weight="700">event_logger</text><text class="muted" x="462" y="324" font-size="11">/events → run 기록</text>
  </g>

  <!-- arm (m0609) -->
  <rect class="box" x="664" y="86" width="312" height="78" rx="10"/>
  <text class="title" x="678" y="108" font-size="14" font-weight="700">arm — m0609_arm</text>
  <text class="muted" x="678" y="128" font-size="11">act /m0609/refill · 레일 후보 preferred_first</text>
  <text class="muted" x="678" y="146" font-size="11">약통 QR 확인 → /orchestrator/check_container</text>

  <!-- nav -->
  <rect class="box" x="664" y="174" width="312" height="162" rx="10"/>
  <text class="title" x="678" y="196" font-size="14" font-weight="700">nav — navigation.launch.py</text>
  <g class="text" font-size="11">
    <text x="678" y="216"><tspan font-weight="700">fleet</tspan> act /amr_1/go_to_zone</text>
    <text x="678" y="234"><tspan font-weight="700">Nav2</tspan> 접근점까지 · map_activation_guard</text>
    <text x="678" y="252"><tspan font-weight="700">speed_governor</tspan> 근접 0.7 · 최고 1.0 m/s</text>
    <text x="678" y="270"><tspan font-weight="700">직접 추종기</tspan>(fleet 안) 마지막 0.5 m</text>
    <text x="678" y="288"><tspan font-weight="700">base_driver</tspan> /amr_1/cmd_vel → /amr_1/odom</text>
    <text x="678" y="306"><tspan font-weight="700">dock_origin_tf</tspan> map→odom · zones_tf</text>
    <text class="muted" x="678" y="324">localization:=odom · dock_1 = 적재 자리</text>
  </g>

  <!-- web -->
  <rect class="box" x="334" y="346" width="318" height="122" rx="10"/>
  <text class="title" x="348" y="368" font-size="14" font-weight="700">web — 관제 백엔드 + 브라우저</text>
  <g class="muted" font-size="11">
    <text x="348" y="388">act 클라이언트 /deliver · srv /orchestrator/reset</text>
    <text x="348" y="406">평면도 · 주문 큐 · QR 판독 · 조제실 재고</text>
    <text x="348" y="424">알람(/p3/alerts) · Play/Stop(/p3/sim_running)</text>
    <text x="348" y="442">카메라 · 스캔 실시간은 --live-sensors(기본 끔)</text>
  </g>

  <!-- flow -->
  <rect class="box" x="664" y="346" width="312" height="122" rx="10"/>
  <text class="title" x="678" y="368" font-size="14" font-weight="700">한 바퀴 (병원 기본)</text>
  <g class="text" font-size="11">
    <text x="678" y="388">① 웹 주문 · 슬롯이 비면 M0609 보충(병렬)</text>
    <text x="678" y="405">② 조제기 배출 → 컨베이어 → A1 탁자에 정착</text>
    <text x="678" y="422">③ dock_1(=적재)에서 봉투 QR 확인 뒤 집기</text>
    <text x="678" y="439">④ Nav2 → 병상 QR 인증 → 보관함에 놓기</text>
    <text x="678" y="456">⑤ 도크 복귀 · 평가기가 보관함을 본다</text>
  </g>

  <!-- arrows -->
  <path class="wire" d="M296 200 H332" stroke-width="2" marker-end="url(#a)"/>
  <path class="wire" d="M332 220 H298" stroke-width="2" marker-end="url(#a)"/>
  <text class="muted" x="314" y="193" font-size="10" text-anchor="middle">JSON</text>
  <path class="wire" d="M493 344 V338" stroke-width="2" marker-end="url(#a)"/>
  <path class="wire" d="M652 125 H662" stroke-width="2" marker-end="url(#a)"/>
  <path class="wire" d="M652 216 H662" stroke-width="2" marker-end="url(#a)"/>

  <!-- claim -->
  <rect class="claim" x="12" y="486" width="976" height="104" rx="10"/>
  <text class="warn" x="26" y="508" font-size="13" font-weight="700">주장 범위(고정)와 검증 상태</text>
  <g class="text" font-size="12">
    <text x="26" y="530">① Nav2 는 접근점까지 간다. 마지막 0.5 m 는 직접 추종기다(회피 · 감속기 미적용).  ② 위치는 도크 기준 odom TF 다. AMCL 은 쓰지 않는다.</text>
    <text x="26" y="550">③ 배송 성공은 평가기가 본 보관함으로 event_logger 가 적는다. orchestrator 의 주장이 아니다.</text>
    <text x="26" y="572">검증: 회전 7(v1.0.0, 코드 9760d9d) 14/14, 다중 PC attempt 12 · 13 미실행. v1.1.0 새 기본값은 acceptance 미실행(#772 5891599172).</text>
  </g>
</svg>

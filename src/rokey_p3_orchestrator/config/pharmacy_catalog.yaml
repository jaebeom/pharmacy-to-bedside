# 약 DB 시드. QR·DB·카메라 계약(docs/architecture/qr-db-camera-contract-v1.md) 2절.
# orchestrator 가 시작할 때 이 파일과 dispenser.yaml·order_pool.yaml 을 읽어 sqlite 표를 채운다.
# 값은 전부 합성 데이터다. 실제 약품 정보가 아니다.
#
# containers 의 로트가 dispenser.yaml 에 있으면 약품·유통기한·수량·위치는 dispenser.yaml 이 정한다.
# 여기에는 cn- ID 와 입고일만 적는다. 두 곳에 같은 값을 적지 않는다.
# dispenser.yaml 에 없는 약통(회수품 등)만 item_id·expiry·count·location·status 를 여기 적는다.


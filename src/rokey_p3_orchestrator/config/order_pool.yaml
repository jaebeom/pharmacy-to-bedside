# 합성 주문 풀. order_generator 가 이 파일을 읽어 Deliver goal 을 만든다.
#
# 계약 7절: 이 파일의 order_id 가 봉투 QR 내용이다. QR 이미지는 이 파일로 생성한다.
# patient_id 와 item_id 는 접두 없는 ID 다. 환자 인식표 QR 은 pt-<patient_id> 가 된다.
# bed 는 zones.yaml 의 구역 ID 이고 bed_ 로 시작한다.
# mode 는 이 주문 하나로 만들 요청의 유형이다. single 또는 urgent. 기본값 single.
#
# 숫자로만 된 ID 는 반드시 따옴표로 감싼다. 안 그러면 YAML 이 정수로 읽고 적재가 거부된다.

version: 1

orders:
  - {order_id: ord-0001, patient_id: "1001", item_id: drug-amox, bed: bed_a1}
  - {order_id: ord-0002, patient_id: "1002", item_id: drug-ibu, bed: bed_a2, mode: urgent}
  - {order_id: ord-0003, patient_id: "1003", item_id: drug-amox, bed: bed_b1}
  - {order_id: ord-0004, patient_id: "1004", item_id: drug-ibu, bed: bed_b2}

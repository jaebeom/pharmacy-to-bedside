# navigation 레인 노드 셋의 파라미터. 계약 v1 2.2절·5절·7절.
#
# 세 노드는 전역 네임스페이스에서 돌고 토픽 이름은 robot_namespace 로 만든다.
# TF(/tf, /tf_static)가 전역이라야 Isaac·AMCL 과 같은 트리를 쓴다.
#
# joint_x·joint_y·joint_yaw 는 USD 조인트 이름이다. master02 ~/test_amr(이태규님 작업, 저장소 밖, 9/20)의
# hospital_amr_nav.usd 에서 확인한 이름을 넣었다. articulation root 는 /World/hopital_custome/ridgeback_ur5 다.
# **마스터에서 확인할 것**: dock_zone 은 리셋 뒤 AMR 이 놓이는 도크다(계약 6절 dock_k).

base_driver:
  ros__parameters:
    use_sim_time: true
    robot_namespace: amr_1
    joint_x: dummy_base_prismatic_x_joint
    joint_y: dummy_base_prismatic_y_joint
    joint_yaw: dummy_base_revolute_z_joint
    command_rate_hz: 20.0
    cmd_vel_timeout_s: 0.5       # wall
    joint_states_timeout_s: 1.0  # wall

fleet:
  ros__parameters:
    use_sim_time: true
    robot_namespace: amr_1
    zones_file: ""               # 비면 rokey_p3_description share 의 config/zones.yaml
    dock_zone: dock_1            # 마스터에서 확인
    navigate_action: /amr_1/navigate_to_pose
    motion_backend: nav2               # nav2(기본) 또는 waypoints(빈월드 v0 고정 경로)
    routes_file: ""                    # waypoints 모드의 월드별 경로 파일. 비면 곧장 간다
    nav2_final_approach: false         # nav2 모드: Nav2 는 접근점(경로의 마지막 waypoint)까지, 정차 자리는 추종기로
    nav2_handoff_radius: 0.5           # final_approach: 접근점까지 이만큼 남으면 Nav2 를 거두고 추종기로(병원 L3 3회차)
    # 속도·가속 상한은 **이 블록 한 곳에서만** 정한다. 스테이지·프로필에 같은 숫자를 또 두지 않는다.
    #
    # 근거: nav2_params.yaml 의 현재 상한의 **90 %** 다(재범 9/24 20:4x "속도 90% 바로". 9/21 에는 그때 상한의 80 %).
    #   max_vel_x/y 1.0 → 0.9,  max_vel_theta 1.0 → 0.9
    #   acc_lim_x/y 1.0 → 0.9,  acc_lim_theta 2.0 → 1.8
    #   그 Nav2 값 자체는 태규님 실측을 반영한 상한이다. 자산의 `max_velocity` 나 Ridgeback 제조사
    #   사양(1.1 m/s)은 **근거로 쓰지 않았다** — 이 장면의 상한과 이어진다는 확인이 없다.
    # 전방향이라 x·y 가 동시에 최대여도 추종기는 **벡터 크기**를 자르므로 max_speed_xy 1.0 을 넘지 않는다.
    follower_max_linear: 0.9           # m/s
    follower_max_angular: 0.9          # rad/s
    # 목표 근처의 거동은 max_linear/slow_radius(= 0.6 /s)로 정해진다. 속도를 올릴 때 이 비를 유지해야
    # 도착 정밀도(참값 d_xy 0.018~0.019)가 그대로다. 0.9 / 0.6 = 1.5.
    follower_slow_radius: 1.5          # m, 이 안에서 거리에 비례해 줄인다
    follower_waypoint_tolerance: 0.05  # m, 이 안이면 그 waypoint 를 지난 것으로 본다.
                                       # 빈월드 장면의 통로 여유가 이 값 위에 서 있다(시뮬 #410 주석)
    # 한 주기에 명령이 바뀔 수 있는 폭. 상판이 칸막이 없는 한 칸이라 봉투가 미끄러질 수 있고,
    # 스테이지 드라이브는 damping 이 커서 명령 계단을 거의 그대로 따라간다(사슬의 유일한 가속 상한이다).
    follower_max_accel: 0.9            # m/s^2
    follower_max_angular_accel: 1.8    # rad/s^2
    follower_rate_hz: 20.0
    follower_arrive_xy: 0.02           # m, 도착으로 볼 반경. zone 공차보다 작아야 도착 정밀도가 공차에 묶이지 않는다
    follower_arrive_yaw: 0.02          # rad, 같은 뜻
    goal_timeout_load_dock_s: 120.0   # sim, 계약 7절
    goal_timeout_ward_s: 180.0        # sim, 계약 7절
    settle_timeout_s: 5.0             # sim
    stopped_rate_hz: 5.0
    stopped_linear_tol: 0.02
    stopped_angular_tol: 0.02
    stopped_hold_s: 0.5
    at_home_max_age_s: 1.0       # wall
    odom_timeout_s: 1.0          # wall
    nav2_server_wait_s: 10.0     # wall
    costmap_clear_wait_s: 10.0   # wall, RESET_DONE 뒤 global/local clear 서비스 탐색·응답 시한
    initialpose_cov_xy: 0.25
    initialpose_cov_yaw: 0.0685

zones_tf:
  ros__parameters:
    use_sim_time: true
    zones_file: ""

dock_origin_tf:
  ros__parameters:
    use_sim_time: true
    robot_namespace: amr_1
    zones_file: ""               # fleet 과 같은 파일이어야 한다(도크 자세의 단일 출처)
    dock_zone: dock_1            # 스테이지의 --amr-start 와 같은 자리여야 한다

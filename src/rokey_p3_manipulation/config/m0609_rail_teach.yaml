# M0609 레일 보충 teach. `m0609_arm` 이 `rail_enabled:=true` 일 때 읽는다(기본 경로, `rail_teach_file` 로 덮는다).
# 조제실 스테이지(sim/standalone/pharmacy_stage.py)의 2축 레일 위 M0609. 레일 관절 rail_x·rail_y(m, 0 = 레일 원점,
# 월드 (0, 0.30, 0)), 팔 joint_1..joint_6(rad). 레일 토픽은 계약 v1 밖이다.
#
# 출처(값을 가공하지 않은 것):
# - "실측": 마클2 master02 9/18 10:05 창 모드 selfdemo, sim 174bb6a(`--preset demo-ros`, 레일 드라이브 1e5/1e4/5e4),
#   로그 master02:/home/rokey/markle_tmp/demo18_stage.log 의 단계별 reached 줄(teach_raw_174bb6a.txt).
#   cycle 1 = 투입구 a, cycle 2 = 투입구 b, 둘 다 TIMEOUT 0, canister_in_inlet=True. Simu 가 옮겨 보냈다(9/18).
#   선반 쪽 단계는 cycle 1 값을 a·b 둘 다에 쓴다(Simu: cycle 2 는 소수 셋째 자리까지 같다).
# - 레일 목표: 같은 실행의 selfdemo 목표값(layout.py plan_rail_refill, 기하 기본값). 실측 도착값이 아니다.
# - "IK": m0609_kinematics(#144, 명목 blue URDF) + TCP = link_6 z 0.19671 m(Simu), 오프라인 계산(팔, 9/18).
#   이 모델의 FK 가 위 실측 자세 9개를 스테이지 TCP 목표와 1 mm 안에서 맞췄다(above_inlet 은 스테이지가 보고한
#   via 오차 0.026 m 그대로). 그래서 두 가지를 IK 로 채웠다.
#   1) 투입구 쪽(above_inlet·inlet_top·inlet_mid·insert·retreat) 전부 IK 다. 9/18 실습3 뒤 스테이지가 투입구를
#      y 0.65 → 0.58 로 옮겼다(Simu fix/sim-practice3-fixes: 손목이 조제기 앞면 y 0.70 을 쳤다, link_4↔DispenserBody).
#      TCP 베이스 기준 above_inlet (0, 0.33, 0.50), inlet_top·inlet_mid·insert (0, 0.33, z 0.45·0.39·0.335),
#      retreat (0, 0.23, 0.50). 실측 insert·release 는 레일이 밀린 상태의 보상값이라 처음부터 쓰지 않았고,
#      실측 above_inlet·retreat 은 옛 투입구(y 0.40) 것이라 버렸다. 관절 보간 경로의 수평 편차 1.5 mm 이하.
#      FK 로 본 조제기 앞면(베이스 기준 y 0.45)까지 link_4·5 원점 거리: 옛 값 0.048 m(z 1.34, 실습3 접촉점 z 1.346 과
#      같은 자리), 새 값 0.119 m. 링크 형상 반지름은 모델에 없다(미확인).
#   2) 선반 드나들기: shelf_front↔above_canister, lift↔pull_out 을 관절 직선으로 이으면 TCP 가 1.9 cm 떠오른다.
#      TCP z 0.38 직선 위 1/3·2/3 점을 IK 로 넣어 편차 4.6 mm·떠오름 3 mm 로 줄였다.
#   IK 값은 Isaac 에서 아직 실행하지 않았다(미실행).
# - tolerance_rad 0.0025(inlet_top·inlet_mid·insert): 투입구 안쪽 0.08 에 캐니스터 폭 0.06(Simu)이라 한쪽 여유가 1 cm 다.
#   이 허용오차로 도착을 확인한 뒤 다음 점으로 내려간다. 자코비안 위치 열 길이 합(y 0.33 기준 inlet_top 1.664,
#   insert 1.748 m/rad) × 0.0025 = 최악 TCP 오차 4.2-4.4 mm.

home:
  joints: [0.0, 0.0, 1.5883, 0.0, 1.5778, 0.0]    # 실측, `arm ready … home=`
  rail: [0.0, 0.0]


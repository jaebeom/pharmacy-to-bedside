[pytest]
# ROS 통합 테스트는 기본 실행에서 뺀다. rclpy 와 빌드된 워크스페이스가 있어야 돌고,
# 없으면 조용히 skip 되어 "안 돌았는데 초록" 이 된다. 빼 두고 명시적으로 부른다:
#
#   python -m pytest tests/ -q                 # 기본 — ROS 없이 도는 것만
#   python -m pytest tests/ -q -m ros          # ROS 통합만 (워크스페이스 source 필요)
#   python -m pytest tests/ -q -m ""           # 전부
addopts = -m "not ros"
markers =
    ros: 실제 rclpy 와 빌드된 워크스페이스가 있어야 도는 통합 테스트
